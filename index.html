    <style>
      body {
        background-color: #f7f9fb;
        color: #191c1e;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .icon-filled {
        font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #c3c6d7;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #737686;
      }
      .card-shadow {
        box-shadow: 0px 4px 12px rgba(15, 23, 42, 0.05);
      }
      .form-input-styled {
        height: 40px;
        background-color: #ffffff;
        border: 1px solid #c3c6d7;
        border-radius: 0.25rem;
        padding-left: 16px;
        padding-right: 16px;
        transition: all 0.2s ease;
      }
      .form-input-styled:focus {
        border-color: #004ac6;
        box-shadow: 0 0 0 2px #dbe1ff;
        outline: none;
      }
      /* NUEVO (ADITIVO): exportar a PDF = capturar la vista actual tal
         cual se ve en la plataforma (mismos graficos, colores y datos) --
         ver exportPdfSnapshot() en App.tsx (html2pdf.js). Estas reglas
         NO estan atadas a @media print porque html2canvas rasteriza el
         DOM con los estilos de pantalla normales, no con los de
         impresion -- por eso el modo "css" de paginacion de html2pdf.js
         necesita poder leerlas siempre. No cambian nada visualmente en
         pantalla (break-inside/break-after solo importan al paginar). */

      /* Evitar que una tarjeta/indicador individual quede cortado justo
         en el salto de pagina. A proposito NO se aplica a <section>
         (agrupa varias tarjetas y puede ser mas alta que una hoja entera
         -- si se le pidiera "no cortar" ahi, quedaria un hueco en blanco
         enorme en vez de simplemente avanzar de pagina). */
      .card-shadow,
      table,
      tr,
      article {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      /* Que un titulo no quede solo al final de una pagina, separado del
         contenido que le sigue. */
      h2,
      h3,
      h4 {
        break-after: avoid-page;
        page-break-after: avoid;
      }

      /* Activada por exportPdfSnapshot() justo antes de capturar (clase
         en <body>, sacada apenas termina): libera los contenedores con
         scroll propio (tablas anchas, el visor del gráfico de tendencia
         diaria) para que se capture todo el contenido, no solo la
         porción que estaba visible en pantalla en ese momento. */
      .is-exporting-pdf .overflow-x-auto,
      .is-exporting-pdf .overflow-y-auto,
      .is-exporting-pdf .overflow-auto {
        overflow: visible !important;
      }
      .is-exporting-pdf .trend-chart-viewport {
        height: auto !important;
        overflow: visible !important;
      }

      /* Respaldo minimo por si alguien usa el Ctrl+P nativo del
         navegador en vez del botón "Exportar" (que ahora usa
         html2pdf.js): al menos oculta el menú lateral y fuerza los
         colores de fondo. */
      @media print {
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          color-adjust: exact !important;
        }
        nav {
          display: none !important;
        }
        .ml-sidebar-width {
          margin-left: 0 !important;
          width: 100% !important;
        }
        main {
          overflow: visible !important;
          height: auto !important;
        }
        .overflow-x-auto,
        .overflow-y-auto,
        .overflow-auto {
          overflow: visible !important;
        }
        .trend-chart-viewport {
          height: auto !important;
          overflow: visible !important;
        }
        body {
          background: #ffffff !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
