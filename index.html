    <style>
      body {
        background-color: #faf8ff;
        color: #131b2e;
        font-family: "Plus Jakarta Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .icon-filled {
        font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #c7c4d8;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #777587;
      }
      .card-shadow {
        box-shadow: 0px 4px 12px rgba(53, 37, 205, 0.08);
      }
      .form-input-styled {
        height: 40px;
        background-color: #ffffff;
        border: 1px solid #c7c4d8;
        border-radius: 0.25rem;
        padding-left: 16px;
        padding-right: 16px;
        transition: all 0.2s ease;
      }
      .form-input-styled:focus {
        border-color: #3525cd;
        box-shadow: 0 0 0 2px #e2dfff;
        outline: none;
      }
      /* NUEVO (ADITIVO): exportar a PDF = imprimir la vista actual tal
         cual se ve en la plataforma (mismos graficos, colores y datos) --
         ver printCurrentView()/ExportButton en App.tsx.

         IMPORTANTE -- por que estas reglas NO estan dentro de
         "@media print": se probo así primero (ocultar el nav, colapsar
         los grids de 2 columnas, forzar flex-col a grid, etc., todo
         gateado por @media print) y, pese a que cada regla se verificó
         syntacticamente correcta y hasta se probó por separado que SI
         funciona cuando se fuerza de forma incondicional, NINGUNA de
         esas reglas se aplicaba en el PDF real -- @media print
         simplemente no se estaba evaluando como verdadero en el
         mecanismo que genera el PDF del usuario. La UNICA corrección
         que sí funcionó de punta a punta fue la que saca el <nav> del
         DOM con React (estado "printing" en App.tsx), que no depende en
         absoluto de @media print. Por eso TODAS las reglas de esta
         sección ahora estan gateadas por la clase ".is-printing", que
         App.tsx agrega/saca de un contenedor de nivel superior usando
         ese mismo estado "printing" -- son reglas CSS comunes y
         corrientes (sin media query), activadas por una clase real en
         el DOM, exactamente el mismo mecanismo ya comprobado con el
         menú lateral. break-inside/break-after no necesitan estar dentro
         de @media print para funcionar: son propiedades que solo tienen
         efecto durante la paginación real (imprimir), sin importar si la
         regla que les da valor está adentro o afuera de un media query. */
      .is-printing * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }
      .is-printing .ml-sidebar-width {
        margin-left: 0 !important;
        width: 100% !important;
      }
      .is-printing main {
        overflow: visible !important;
        height: auto !important;
      }
      /* Los contenedores con scroll propio (tablas anchas, el visor del
         gráfico de tendencia diaria) solo mostrarían, al imprimir, la
         porción que estaba visible en pantalla -- se ven "cortados" o
         "desfazados". Los liberamos para que se imprima todo. */
      .is-printing .overflow-x-auto,
      .is-printing .overflow-y-auto,
      .is-printing .overflow-auto {
        overflow: visible !important;
      }
      .is-printing .trend-chart-viewport {
        height: auto !important;
        overflow: visible !important;
      }
      .is-printing {
        background: #ffffff !important;
      }
      /* Evitar que una tarjeta/indicador individual quede cortado justo
         en el salto de página. A propósito NO se aplica a <section>
         (agrupa varias tarjetas y puede ser más alta que una hoja
         entera -- forzar "no cortar" ahí dejaría un hueco en blanco
         enorme en vez de simplemente avanzar de página). */
      .is-printing .card-shadow,
      .is-printing table,
      .is-printing tr,
      .is-printing article {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      /* Que un título no quede solo al final de una página, separado del
         contenido que le sigue. */
      .is-printing h2,
      .is-printing h3,
      .is-printing h4 {
        break-after: avoid-page;
        page-break-after: avoid;
      }
      /* Los navegadores fragmentan de forma confiable un layout de
         bloques (cada hijo, uno debajo del otro), pero fragmentan mal el
         contenido DENTRO de un contenedor flex (que es como está armada
         casi toda esta plataforma). Durante la impresión, los
         contenedores que apilan verticalmente (".flex-col") pasan a
         grid de una sola columna implícita -- mismo espaciado, mismo
         apilado visual, pero el motor de paginación sí sabe fragmentar
         bien un grid. No se toca ".flex" a secas (sin "-col"), que es lo
         que usan las filas horizontales -- ícono + texto, badges,
         botones -- para no romper esa alineación lado a lado. */
      .is-printing .flex-col {
        display: grid !important;
      }
      /* Las secciones armadas como grid de 2+ columnas lado a lado (ej.
         "Distribución de servicios cumplidos" + "Calidad de
         información") paginan mal: el motor de impresión puede cortar
         cada columna en una altura DISTINTA e independiente, dejando el
         título de una columna solo al final de una hoja mientras su
         contenido salta a la siguiente. Selector por coincidencia de
         clase: agarra "grid-cols-1", "lg:grid-cols-2",
         "xl:grid-cols-12", etc. sin necesidad de listarlas todas. Los
         hijos con "col-span-N" simplemente ocupan el ancho completo de
         esa única columna, sin romper nada. */
      .is-printing [class*="grid-cols-"] {
        grid-template-columns: 1fr !important;
      }
    </style>
