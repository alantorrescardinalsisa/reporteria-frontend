    <style>
      body {
        background-color: #f7f9fb;
        color: #191c1e;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .icon-filled {
        font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #c3c6d7;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #737686;
      }
      .card-shadow {
        box-shadow: 0px 4px 12px rgba(15, 23, 42, 0.05);
      }
      .form-input-styled {
        height: 40px;
        background-color: #ffffff;
        border: 1px solid #c3c6d7;
        border-radius: 0.25rem;
        padding-left: 16px;
        padding-right: 16px;
        transition: all 0.2s ease;
      }
      .form-input-styled:focus {
        border-color: #004ac6;
        box-shadow: 0 0 0 2px #dbe1ff;
        outline: none;
      }
      /* NUEVO (ADITIVO): exportar a PDF = imprimir la vista actual tal
         cual se ve en la plataforma (mismos graficos, colores y datos) --
         ver printCurrentView()/ExportButton en App.tsx. Se probo antes
         con html2pdf.js (html2canvas + jsPDF), pero esa libreria
         rasteriza el DOM con su propio motor de medicion, que no
         entiende bien el layout con flexbox anidado de esta plataforma:
         tarjetas enteras quedaban partidas al medio entre una hoja y la
         siguiente pese a tener break-inside:avoid (confirmado
         visualmente en un PDF de prueba). window.print() usa el mismo
         motor de renderizado que ya pinta la pantalla -- no hay paso de
         rasterizado intermedio que pueda mal-interpretar el layout. */
      @media print {
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          color-adjust: exact !important;
        }
        /* display:none solo a veces no alcanza para un elemento
           position:fixed en impresión (bug conocido de Chromium/WebKit:
           el motor de paginación intenta repetir los elementos fixed en
           cada hoja, y esa lógica puede ganarle al display:none) -- por
           eso también se le saca el position:fixed acá. */
        nav {
          display: none !important;
          position: static !important;
        }
        /* EL AJUSTE CLAVE de esta vuelta: las secciones armadas como
           grid de 2+ columnas lado a lado (ej. "Distribución de
           servicios cumplidos" + "Calidad de información", cada una en
           su propia columna con "lg:grid-cols-2") paginan mal, incluso
           con todas las reglas de break-inside/break-after ya puestas:
           el motor de impresión puede cortar cada columna en una altura
           DISTINTA e independiente, dejando el título de una columna
           solo al final de una hoja mientras su contenido salta a la
           siguiente (confirmado visualmente en un PDF de prueba). Es un
           problema conocido de layouts multi-columna en impresión, sin
           relación con las reglas de break-inside que ya funcionan bien
           para contenido en una sola columna. La solución: durante la
           impresión, cualquier grid con columnas (selector por
           coincidencia de clase, agarra "grid-cols-1", "lg:grid-cols-2",
           "xl:grid-cols-12", etc. sin necesidad de listarlas todas)
           colapsa a una sola columna -- así cada bloque se imprime de
           punta a punta antes de pasar al siguiente, en vez de dos
           columnas independientes compitiendo por el mismo salto de
           página. Los hijos con "col-span-N" simplemente ocupan el
           ancho completo de esa única columna, sin romper nada. */
        [class*="grid-cols-"] {
          grid-template-columns: 1fr !important;
        }
        .ml-sidebar-width {
          margin-left: 0 !important;
          width: 100% !important;
        }
        main {
          overflow: visible !important;
          height: auto !important;
        }
        /* Los contenedores con scroll propio (tablas anchas, el visor
           del gráfico de tendencia diaria) solo mostrarían, al imprimir,
           la porción que estaba visible en pantalla -- se ven "cortados"
           o "desfazados". Los liberamos para que se imprima todo. */
        .overflow-x-auto,
        .overflow-y-auto,
        .overflow-auto {
          overflow: visible !important;
        }
        .trend-chart-viewport {
          height: auto !important;
          overflow: visible !important;
        }
        body {
          background: #ffffff !important;
        }
        /* Evitar que una tarjeta/indicador individual quede cortado
           justo en el salto de página. A propósito NO se aplica a
           <section> (agrupa varias tarjetas y puede ser más alta que
           una hoja entera -- forzar "no cortar" ahí dejaría un hueco en
           blanco enorme en vez de simplemente avanzar de página). */
        .card-shadow,
        table,
        tr,
        article {
          break-inside: avoid;
          page-break-inside: avoid;
        }
        /* Que un título no quede solo al final de una página, separado
           del contenido que le sigue. */
        h2,
        h3,
        h4 {
          break-after: avoid-page;
          page-break-after: avoid;
        }
        /* EL AJUSTE CLAVE para que los saltos de página no queden
           "desfazados": los navegadores fragmentan de forma confiable
           un layout de bloques (cada hijo, uno debajo del otro), pero
           fragmentan mal el contenido DENTRO de un contenedor flex
           (que es como está armada casi toda esta plataforma:
           "flex flex-col" para apilar título + tarjeta + tarjeta...).
           Ese es justo el motivo por el que break-inside:avoid en las
           tarjetas no alcanzaba a evitar los cortes. Durante la
           impresión, los contenedores que apilan verticalmente
           (".flex-col") pasan a grid de una sola columna implícita --
           mismo espaciado (gap funciona igual en grid que en flex) y
           mismo apilado visual, pero el motor de paginación del
           navegador sí sabe fragmentar bien un grid. No se toca ".flex"
           a secas (sin "-col"), que es lo que usan las filas
           horizontales -- ícono + texto, badges, botones -- para no
           romper esa alineación lado a lado. */
        .flex-col {
          display: grid !important;
        }
      }
    </style>
